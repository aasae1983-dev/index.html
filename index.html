<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صدقة جارية - العدادات الحية</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Firebase App & Database -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-cream: #FDFBF7;
      --bg-card: #F4EFE6;
      --primary-green: #1B4D3E;
      --deep-green: #0F3328;
      --accent-gold: #C59B27;
      --gold-light: #E5C365;
      --text-main: #2A332E;
      --text-muted: #5C6B63;
      --border-color: #E2D9C8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .header-card {
      width: 100%;
      background: linear-gradient(135deg, var(--deep-green) 0%, var(--primary-green) 100%);
      color: #FFF;
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      border: 1px solid var(--accent-gold);
      box-shadow: 0 12px 30px rgba(15, 51, 40, 0.15);
    }

    .header-title {
      font-family: 'Reem Kufi', sans-serif;
      font-size: 1.8rem;
      color: var(--gold-light);
      margin-bottom: 8px;
    }

    .header-subtitle {
      font-size: 0.95rem;
      color: #E0EADF;
      line-height: 1.6;
    }

    .dhikr-selector {
      width: 100%;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 4px;
      scrollbar-width: none;
    }

    .dhikr-tab {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      color: var(--text-main);
    }

    .dhikr-tab.active {
      background: var(--primary-green);
      color: #FFF;
      border-color: var(--accent-gold);
    }
