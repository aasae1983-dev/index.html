<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صدقة جارية - العدادات الحية</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Firebase App & Database -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-cream: #FDFBF7;
      --bg-card: #F4EFE6;
      --primary-green: #1B4D3E;
      --deep-green: #0F3328;
      --accent-gold: #C59B27;
      --gold-light: #E5C365;
      --text-main: #2A332E;
      --text-muted: #5C6B63;
      --border-color: #E2D9C8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .header-card {
      width: 100%;
      background: linear-gradient(135deg, var(--deep-green) 0%, var(--primary-green) 100%);
      color: #FFF;
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      border: 1px solid var(--accent-gold);
    }

    .header-title {
      font-family: 'Reem Kufi', sans-serif;
      font-size: 1.8rem;
      color: var(--gold-light);
      margin-bottom: 8px;
    }

    .header-subtitle {
      font-size: 0.95rem;
      color: #E0EADF;
      line-height: 1.6;
    }

    .dhikr-selector {
      width: 100%;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 4px;
      scrollbar-width: none;
    }

    .dhikr-tab {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      color: var(--text-main);
    }

    .dhikr-tab.active {
      background: var(--primary-green);
      color: #FFF;
      border-color: var(--accent-gold);
    }

    .dhikr-display-card {
      width: 100%;
      background: var(--bg-card);
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .dhikr-text {
      font-family: 'Amiri', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-green);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .counters-wrapper {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .counter-box {
      flex: 1;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .counter-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary-green);
    }

    .counter-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .tasbeeh-btn-wrapper {
      margin-top: 10px;
    }

    .tasbeeh-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary-green), var(--deep-green));
      border: 4px solid var(--accent-gold);
      color: var(--gold-light);
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 25px rgba(27, 77, 62, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tasbeeh-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <div class="header-title">صدقة جارية</div>
      <div class="header-subtitle">هذا التطبيق صدقة جارية لروح من تحب<br>اضغط للذكر لتكون في ميزان حسناتك وميزان حسنات من تحب</div>
    </div>

    <div class="dhikr-selector" id="dhikrTabs"></div>

    <div class="dhikr-display-card">
      <div class="dhikr-text" id="dhikrText">أستغفر الله العظيم واتوب إليه</div>
      
      <div class="counters-wrapper">
        <div class="counter-box">
          <div class="counter-val" id="globalCounter">0</div>
